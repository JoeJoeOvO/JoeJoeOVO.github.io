name: Update homepage resource metrics

on:
  schedule:
    - cron: "17 20 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homepage-resource-metrics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Test metric publisher
        run: python -m unittest discover -s scripts/tests -v

      - name: Update and publish resource metric cache
        run: python scripts/update_homepage_metrics.py --resources-only --commit-message "Update homepage resource metric cache"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
